<header class="site-header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }}, accueil">
      {{ partial "logo.html" . }}
      <span class="brand-word">terrain<em>RH</em></span>
    </a>
    <nav class="main-nav" id="nav" aria-label="Navigation principale">
      <ul>
        {{ $current := . }}
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
        {{ with site.GetPage "/articles/meilleur-logiciel-entretiens-annuels" }}<li><a class="nav-hot" href="{{ .RelPermalink }}">Comparatif<span>2026</span></a></li>{{ end }}
      </ul>
      <a class="btn btn--ink nav-mobile-cta" href="#lettre">S'abonner à la lettre</a>
    </nav>
    <a class="btn btn--ink btn--sm header-cta" href="#lettre">S'abonner{{ partial "arrow.html" }}</a>
    <button class="burger" type="button" aria-controls="nav" aria-expanded="false" data-burger><span></span><span></span><span class="sr">Menu</span></button>
  </div>
</header>
