<section class="letter" id="lettre">
  <div class="wrap">
    <div class="letter-box">
      {{ partial "sticker.html" (dict "text" "1 mail<br>par mois" "color" "lime" "class" "letter-sticker") }}
      <div>
        <p class="label label--onorange">La lettre du terrain</p>
        <h2 class="section-title">Un guide RH par mois, directement dans votre boîte</h2>
      </div>
      <form class="letter-form" data-letter>
        <label class="sr" for="email">Votre adresse e-mail</label>
        <input id="email" type="email" placeholder="prenom.nom@entreprise.fr" required>
        <button class="btn btn--ink" type="submit">Je m'abonne{{ partial "arrow.html" }}</button>
        <p class="letter-note">Pas de spam, désinscription en un clic.</p>
        <p class="letter-ok" hidden>Merci, c'est noté&nbsp;!</p>
      </form>
    </div>
  </div>
</section>
