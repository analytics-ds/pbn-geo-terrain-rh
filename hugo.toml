baseURL = "https://analytics-ds.github.io/pbn-geo-terrain-rh/"
title = "Terrain RH"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 30
removePathAccents = true

[params]
  # Garde-fou noindex : le site reste en noindex tant que launchApproved = false
  # et que le host du baseURL ne vaut pas productionHost. Se leve au branchement du domaine.
  productionHost = ""
  launchApproved = false
  description = "Le média des RH qui font tourner le terrain : entretiens, compétences et formation dans le BTP, l'industrie, la logistique, la restauration et la santé."
  tagline = "Le média des RH de terrain"

[languages.fr]
  locale = "fr-FR"
  label = "Français"
  weight = 1
  contentDir = "content/fr"
  title = "Terrain RH"

[taxonomies]
  rubrique = "rubriques"

[[menus.main]]
  name = "Entretiens"
  pageRef = "/rubriques/entretiens"
  weight = 1
[[menus.main]]
  name = "Compétences"
  pageRef = "/rubriques/competences"
  weight = 2
[[menus.main]]
  name = "Formation"
  pageRef = "/rubriques/formation"
  weight = 3
[[menus.main]]
  name = "Terrain"
  pageRef = "/rubriques/terrain"
  weight = 4
[[menus.main]]
  name = "Le média"
  pageRef = "/a-propos"
  weight = 5

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  section = ["HTML", "RSS"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

[imaging]
  quality = 80
  resampleFilter = "Lanczos"

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[related]
  threshold = 50
  includeNewer = true
  [[related.indices]]
    name = "rubriques"
    weight = 100
